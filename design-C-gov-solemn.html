<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站暂停使用通知 · 城市生态环境效益智能管控平台</title>
<!--
  设计稿 C：政务庄重风
  整体配色：深藏青 #14213d / 墨蓝 #1d3557 / 金 #d4af37 / 红点缀 #c53929 / 白 #ffffff
  字体选择：微软雅黑 / 思源黑体，标题 800 字重；数字与线饰用衬线感宋体族
  背景虚化：20px 重度高斯模糊 + 深藏青遮罩（约 88% 不透明度）+ 金色细线纹理
  文字排版：页面正中央，双居中；顶部红头标条 + 主文案 + 双线分隔 + 落款式说明
  整体视觉：政务公告、正式权威、庄重大气
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    overflow: hidden;
    background: #14213d;
    color: #ffffff;
  }

  /* ===== 背景层：城市航拍 + 重度虚化 ===== */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: url("assets/shanghai_aerial.jpg") center / cover no-repeat;
    filter: blur(20px) saturate(0.92) brightness(0.62);
    transform: scale(1.1);
  }

  /* 深藏青遮罩 */
  .bg-mask {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(180deg, rgba(20, 33, 61, 0.92) 0%, rgba(29, 53, 87, 0.86) 50%, rgba(20, 33, 61, 0.94) 100%);
  }

  /* 金色细线纹理 */
  .bg-lines {
    position: fixed;
    inset: 0;
    z-index: 2;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 78px, rgba(212, 175, 55, 0.06) 78px, rgba(212, 175, 55, 0.06) 79px);
    pointer-events: none;
  }

  /* 边框装饰 */
  .frame {
    position: fixed;
    inset: clamp(12px, 2.4vw, 30px);
    z-index: 3;
    border: 1px solid rgba(212, 175, 55, 0.32);
    pointer-events: none;
  }

  .frame::before,
  .frame::after {
    content: "";
    position: absolute;
    width: clamp(26px, 4vw, 52px);
    height: clamp(26px, 4vw, 52px);
    border: 2px solid rgba(212, 175, 55, 0.72);
  }
  .frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .frame::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* ===== 中央内容区 ===== */
  .notice {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(5vh, 8vh, 10vh) 7vw;
    gap: clamp(14px, 2.4vh, 28px);
  }

  /* 红头标条 */
  .gov-banner {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    color: #d4af37;
    font-size: clamp(13px, 1.6vw, 18px);
    letter-spacing: clamp(3px, 0.8vw, 8px);
    font-weight: 500;
  }

  .gov-banner .stripe {
    width: clamp(34px, 5vw, 70px);
    height: 3px;
    background: linear-gradient(90deg, #c53929, #d4af37);
    border-radius: 2px;
    flex-shrink: 0;
  }

  .gov-banner .stripe.r {
    background: linear-gradient(90deg, #d4af37, #c53929);
  }

  /* 主文案 */
  .headline {
    color: #ffffff;
    font-size: clamp(28px, 5.8vw, 74px);
    font-weight: 800;
    line-height: 1.32;
    letter-spacing: clamp(2px, 0.5vw, 6px);
    text-shadow: 0 3px 24px rgba(0, 0, 0, 0.55);
  }

  .headline .line-1 {
    display: block;
    color: #e8c978;
    font-size: 0.58em;
    font-weight: 700;
    letter-spacing: clamp(5px, 1vw, 12px);
    margin-bottom: clamp(8px, 1.2vh, 16px);
  }

  /* 双线分隔（政务风格） */
  .divider {
    width: clamp(110px, 22vw, 320px);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .divider .thick {
    height: 3px;
    background: linear-gradient(90deg, transparent, #c53929, #d4af37, transparent);
    border-radius: 3px;
  }

  .divider .thin {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.55), transparent);
  }

  /* 辅助说明 */
  .sub-text {
    color: rgba(232, 238, 248, 0.94);
    font-size: clamp(13px, 1.9vw, 21px);
    line-height: 2.05;
    letter-spacing: 1.5px;
    max-width: 38em;
  }

  .sub-text .em {
    color: #e8c978;
    font-weight: 700;
    border-bottom: 1px solid rgba(212, 175, 55, 0.5);
    padding-bottom: 2px;
  }

  /* 落款式底部 */
  .footnote {
    margin-top: clamp(4px, 1vh, 12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(214, 224, 240, 0.78);
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: 2px;
  }

  .footnote .seal-line {
    width: clamp(60px, 9vw, 110px);
    height: 1px;
    background: rgba(212, 175, 55, 0.42);
    margin-bottom: 2px;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .notice { padding: 6vh 7vw; gap: clamp(12px, 2vh, 22px); }
    .frame { inset: 10px; }
    .headline { letter-spacing: 1px; }
    .sub-text { line-height: 1.9; }
  }

  @media (max-width: 480px) {
    .headline { font-size: clamp(22px, 7.2vw, 32px); }
    .headline .line-1 { font-size: 0.64em; letter-spacing: 3px; margin-bottom: 6px; }
    .sub-text { font-size: 12.5px; letter-spacing: 0.5px; line-height: 1.85; }
    .gov-banner { font-size: 11px; letter-spacing: 2px; gap: 8px; }
    .gov-banner .stripe { width: 24px; }
    .bg-layer { filter: blur(14px) saturate(0.92) brightness(0.62); }
    .footnote { font-size: 10.5px; letter-spacing: 1px; }
  }

  @media (max-height: 520px) and (orientation: landscape) {
    .notice { gap: 10px; padding: 3vh 8vw; }
    .headline { font-size: clamp(20px, 4.4vw, 38px); }
    .headline .line-1 { font-size: 0.54em; margin-bottom: 4px; }
    .sub-text { font-size: clamp(11px, 1.6vw, 15px); line-height: 1.6; }
    .footnote { flex-direction: row; gap: 16px; }
    .footnote .seal-line { display: none; }
  }
</style>
</head>
<body>

<!-- 背景虚化层 -->
<div class="bg-layer"></div>
<div class="bg-mask"></div>
<div class="bg-lines"></div>
<div class="frame"></div>

<!-- 中央通知内容 -->
<main class="notice" role="main">

  <!-- 红头标条 -->
  <div class="gov-banner">
    <span class="stripe"></span>
    <span>城市生态环境效益智能管控平台</span>
    <span class="stripe r"></span>
  </div>

  <!-- 主文案 -->
  <h1 class="headline">
    <span class="line-1">接相关要求</span>
    进博会期间网站暂停使用
  </h1>

  <!-- 双线分隔 -->
  <div class="divider">
    <div class="thick"></div>
    <div class="thin"></div>
  </div>

  <!-- 辅助说明 -->
  <p class="sub-text">
    为配合<span class="em">中国国际进口博览会</span>相关工作安排<br>
    本网站将暂停对外服务，恢复时间另行通知
  </p>

  <!-- 落款式底部 -->
  <div class="footnote">
    <div class="seal-line"></div>
    <span>给您带来的不便，敬请谅解</span>
  </div>

</main>

</body>
</html>
