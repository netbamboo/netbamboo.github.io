  /* 遮罩：绿色渐变叠加，强化文字可读性 */
  .bg-mask {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(244, 250, 246, 0.88) 0%, rgba(233, 245, 236, 0.80) 55%, rgba(46, 125, 91, 0.72) 100%);
  }

  /* 微光纹理，增加层次 */
  .bg-texture {
    position: fixed;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(circle at 18% 22%, rgba(168, 213, 186, 0.35) 0%, transparent 42%),
      radial-gradient(circle at 84% 78%, rgba(46, 125, 91, 0.28) 0%, transparent 46%);
    pointer-events: none;
  }

  /* ===== 中央内容区 ===== */
  .notice {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4vh 6vw;
    gap: clamp(14px, 2.4vh, 28px);
  }

  /* 顶部：平台标识 */
  .platform-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 26px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(46, 125, 91, 0.30);
    border-radius: 100px;
    color: #2e7d5b;
    font-size: clamp(13px, 1.6vw, 17px);
    letter-spacing: 2px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .platform-tag .leaf-icon {
    width: clamp(18px, 2vw, 24px);
    height: clamp(18px, 2vw, 24px);
    fill: #2e7d5b;
    flex-shrink: 0;
  }

  /* 主标题 */
  .headline {
    color: #143826;
    font-size: clamp(30px, 6.2vw, 78px);
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: clamp(2px, 0.5vw, 6px);
    text-shadow: 0 2px 18px rgba(255, 255, 255, 0.85);
    max-width: 18em;
  }

  .headline .line-1 {
    display: block;
    color: #2e7d5b;
    font-size: 0.62em;
    font-weight: 700;
    letter-spacing: clamp(6px, 1.2vw, 14px);
    margin-bottom: clamp(6px, 1vh, 14px);
    opacity: 0.92;
  }

  /* 装饰分隔线 */
  .divider {
    width: clamp(80px, 14vw, 190px);
    height: 3px;
    background: linear-gradient(90deg, transparent, #2e7d5b, transparent);
    border-radius: 3px;
  }

  /* 辅助说明 */
  .sub-text {
    color: #2b5241;
    font-size: clamp(14px, 2vw, 22px);
    line-height: 1.9;
    letter-spacing: 1px;
    max-width: 34em;
  }

  .sub-text .em {
    color: #1a4731;
    font-weight: 700;
    border-bottom: 2px solid rgba(46, 125, 91, 0.45);
    padding-bottom: 2px;
  }

  /* 底部：恢复提示 */
  .footnote {
    color: #3d6b54;
    font-size: clamp(12px, 1.5vw, 16px);
    letter-spacing: 1.5px;
    opacity: 0.92;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .footnote .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2e7d5b;
    opacity: 0.7;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .notice { padding: 6vh 7vw; gap: clamp(12px, 2vh, 20px); }
    .platform-tag { padding: 8px 18px; letter-spacing: 1px; }
    .headline { letter-spacing: 1px; }
    .sub-text { line-height: 1.85; }
  }

  @media (max-width: 480px) {
    .headline { font-size: clamp(24px, 7.4vw, 34px); }
    .headline .line-1 { font-size: 0.66em; letter-spacing: 3px; }
    .sub-text { font-size: 13.5px; }
    .footnote { flex-direction: column; gap: 4px; }
    .footnote .dot { display: none; }
    .bg-layer { filter: blur(9px) saturate(1.1); }
    .bg-mask {
      background: radial-gradient(ellipse at 50% 42%, rgba(244, 250, 246, 0.92) 0%, rgba(233, 245, 236, 0.86) 58%, rgba(46, 125, 91, 0.70) 100%);
    }
  }

  @media (max-height: 520px) and (orientation: landscape) {
    .notice { gap: 10px; padding: 3vh 6vw; }
    .headline { font-size: clamp(22px, 4.4vw, 40px); }
    .sub-text { font-size: clamp(12px, 1.7vw, 17px); line-height: 1.6; }
    .platform-tag { padding: 6px 16px; font-size: 12px; }
  }
</style>
</head>
